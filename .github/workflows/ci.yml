name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # A versão do pnpm vem do campo "packageManager" do package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Não bloqueante por enquanto: há erros de lint anteriores a este workflow
      # (primitivos em components/ui, hooks/use-mobile.ts e código do Notes).
      # Torne bloqueante removendo continue-on-error quando o passivo for zerado.
      - name: Lint
        run: pnpm run lint
        continue-on-error: true

      - name: Tests
        run: pnpm run test:notes

      - name: Build
        run: pnpm run build
